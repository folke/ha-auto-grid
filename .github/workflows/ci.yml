name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and re-upload (leave empty to only run CI)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Record verified commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: auto-grid
          path: dist/auto-grid.js
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create automation token
        id: automation-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Update release PR or publish merged release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.automation-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: main

  publish:
    needs: [build, release]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-asset-${{ needs.release.outputs.tag_name || inputs.release_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.release_tag }}
      BUILD_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Check release matches the verified build
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$release_sha" != "$BUILD_SHA" ]]; then
            echo "::error::Release $RELEASE_TAG points to $release_sha, but CI verified $BUILD_SHA. Retry with release_tag=$RELEASE_TAG."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: auto-grid
          path: dist
      - name: Attach installable JavaScript to the release
        run: gh release upload "$RELEASE_TAG" dist/auto-grid.js --clobber

  validate-release:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/validate.yml
