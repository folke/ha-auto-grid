<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auto Grid browser smoke test</title>
  </head>
  <body>
    <pre id="result">Running…</pre>
    <script type="module">
      import "../dist/auto-grid.js"

      const tick = () => new Promise((resolve) => setTimeout(resolve, 0))
      let assertions = 0
      function assert(value, message) {
        assertions++
        if (!value) throw new Error(message)
      }
      try {
        const subscriptions = []
        const registrySubscriptions = []
        let stops = 0
        let created = 0
        let failHeadings = false
        let holdHeadings = false
        const pendingCards = []
        const pendingHeadings = []
        class TestTile extends HTMLElement {
          setConfig(config) {
            this.setCount = (this.setCount ?? 0) + 1
            this.config = config
            this.textContent = config.entity
          }
          getCardSize() {
            return 1
          }
        }
        customElements.define("test-tile", TestTile)
        class TestHeading extends TestTile {
          setConfig(config) {
            super.setConfig(config)
            this.textContent = config.heading ?? ""
          }
        }
        customElements.define("test-heading", TestHeading)
        window.loadCardHelpers = async () => ({
          createCardElement(config) {
            if (config.type !== "heading") created++
            const card = document.createElement(
              config.type === "heading"
                ? "test-heading"
                : config.type === "custom:auto-grid"
                  ? "auto-grid"
                  : "test-tile"
            )
            card.setConfig(config)
            if (config.type === "custom:slow-card")
              return new Promise((resolve) => pendingCards.push({ card, resolve }))
            if (config.type === "heading" && failHeadings) throw new Error("Heading helper failed")
            if (config.type === "heading" && holdHeadings)
              return new Promise((resolve) => pendingHeadings.push({ config, card, resolve }))
            return card
          },
        })
        const connection = {
          subscribeMessage(callback, request) {
            if (request.type !== "render_template") {
              registrySubscriptions.push({ callback, request, closed: false })
              const entry = registrySubscriptions.at(-1)
              return Promise.resolve(() => {
                entry.closed = true
              })
            }
            subscriptions.push({ callback, request })
            return Promise.resolve(() => {
              stops++
            })
          },
        }
        const emit = (index, ids) =>
          subscriptions[index].callback({
            result: ids.map((id) => (typeof id === "string" ? { entity: id, group: 0 } : id)),
          })
        const hass = { connection, states: {} }
        const config = {
          include: { area: "pool", domain: "light" },
          card: { name: { type: "entity" } },
        }
        const grid = document.createElement("auto-grid")
        let sizeUpdates = 0
        grid.addEventListener("card-updated", () => sizeUpdates++)
        grid.setConfig(config)
        grid.hass = hass
        assert(subscriptions.length === 0, "no subscription while disconnected")
        document.body.append(grid)
        await tick()
        assert(subscriptions.length === 1, "subscribed when mounted")
        assert(
          getComputedStyle(grid).display === "none" &&
            !grid.shadowRoot.querySelector('[role="status"]') &&
            (await grid.getCardSize()) === 0,
          "show_empty false suppresses initial loading content and reserved height"
        )
        assert(
          grid.hidden && grid.connectedWhileHidden && grid.isConnected,
          "loading grids report native visibility while staying connected and subscribed"
        )
        grid.preview = true
        await tick()
        assert(
          getComputedStyle(grid).display !== "none" &&
            grid.shadowRoot
              .querySelector('[role="status"]')
              .textContent.includes("Loading entities"),
          "preview retains a loading placeholder"
        )
        grid.preview = false
        grid.setConfig({ ...config, show_empty: true, title: "Pending" })
        await tick()
        assert(
          grid.shadowRoot
            .querySelector('[role="status"]')
            .textContent.includes("Loading entities") &&
            grid.shadowRoot.querySelector(".card-header").textContent === "Pending" &&
            (await grid.getCardSize()) === 2,
          "show_empty true retains loading content, title, and sizing"
        )
        grid.setConfig(config)
        await tick()
        assert(
          getComputedStyle(grid).display === "none" &&
            !grid.shadowRoot.querySelector(".card-header") &&
            subscriptions.length === 1,
          "returning to show_empty false hides all placeholders without reopening the query"
        )
        emit(0, ["light.a", "light.b"])
        await tick()
        await grid.updateComplete
        const tiles = () => [...grid.shadowRoot.querySelectorAll("test-tile")]
        const [a, b] = tiles()
        assert(
          a?.config.entity === "light.a" && b?.config.entity === "light.b",
          "renders native helper cards"
        )
        assert(a.config.type === "tile" && a.config.name.type === "entity", "shared options")
        assert(a.hass === hass, "initial hass forwarded")
        assert(
          getComputedStyle(grid.shadowRoot.querySelector(".grid")).display === "grid",
          "CSS grid layout"
        )
        assert((await grid.getCardSize()) === 1, "card size uses row maxima")
        assert(!grid.shadowRoot.querySelector(".card-header"), "title is optional")
        const updatesAfterInitialResult = sizeUpdates
        let mutations = 0
        const observer = new MutationObserver(() => mutations++)
        observer.observe(grid.shadowRoot, { subtree: true, childList: true, attributes: true })
        for (let i = 0; i < 100; i++) grid.hass = { ...hass, states: { generation: i } }
        await tick()
        assert(mutations === 0, "hass updates do not touch grid DOM")
        assert(
          sizeUpdates === updatesAfterInitialResult,
          "ordinary hass updates do not ask Masonry to relayout"
        )
        assert(a.hass.states.generation === 99, "updated state reaches children")
        emit(0, ["light.b", "light.a", "light.c"])
        await tick()
        assert(tiles()[0] === b && tiles()[1] === a, "keyed rendering preserves card identity")
        assert(created === 3, "only the added card was created")
        grid.setConfig({ ...config, columns: "all" })
        await tick()
        const columnCounts = () =>
          [...grid.shadowRoot.querySelectorAll(".grid")].map(
            (el) => getComputedStyle(el).gridTemplateColumns.split(" ").length
          )
        assert(columnCounts()[0] === 3, "all gives every card its own column")
        assert((await grid.getCardSize()) === 1, "all sizing is one row")
        b.getCardSize = () => 3
        assert((await grid.getCardSize()) === 3, "all sizing uses the tallest child")
        delete b.getCardSize
        grid.style.width = "120px"
        await tick()
        const autoCells = [...grid.shadowRoot.querySelectorAll(".cell")]
        assert(
          new Set(autoCells.map((cell) => cell.offsetTop)).size === 1,
          "all never wraps on narrow screens"
        )
        assert(
          Math.max(...autoCells.map((cell) => cell.getBoundingClientRect().width)) -
            Math.min(...autoCells.map((cell) => cell.getBoundingClientRect().width)) <
            1,
          "all columns have equal widths"
        )
        grid.style.removeProperty("width")
        grid.setConfig({ ...config, columns: 1 })
        await tick()
        assert(
          columnCounts()[0] === 1 && (await grid.getCardSize()) === 3,
          "switching to one column restores vertical layout"
        )
        assert(
          !grid.shadowRoot.querySelector(".grid").hasAttribute("style"),
          "fixed columns remove the per-grid auto override"
        )
        assert(
          tiles()[0] === b && tiles()[1] === a && created === 3 && subscriptions.length === 1,
          "all/fixed layout switches preserve cards and the query"
        )
        grid.setConfig({ ...config, columns: 3, title: "Pool lights" })
        await tick()
        assert(
          created === 3 && subscriptions.length === 1,
          "layout edits don't recreate cards or query"
        )
        assert(
          getComputedStyle(grid).getPropertyValue("--auto-grid-columns").trim() === "3",
          "column configuration"
        )
        assert(
          grid.shadowRoot.querySelector(".card-header").textContent === "Pool lights",
          "renders a native-style grid heading"
        )
        assert((await grid.getCardSize()) === 2, "title contributes to card size")
        assert(tiles()[0] === b, "adding a title preserves existing cards")
        const mainHeading = grid.shadowRoot.querySelector(".card-header test-heading")
        assert(
          mainHeading?.config.type === "heading" && mainHeading.config.heading_style === "title",
          "legacy title creates an actual native Title heading card"
        )
        grid.setConfig({ ...config, columns: 3, title: "<img src=x onerror=alert(1)>" })
        await tick()
        assert(
          grid.shadowRoot.querySelector(".card-header").textContent ===
            "<img src=x onerror=alert(1)>" && !grid.shadowRoot.querySelector("img"),
          "title renders as text, not HTML"
        )
        grid.setConfig({
          ...config,
          columns: 3,
          heading: {
            heading: "Office",
            icon: "mdi:desk",
            badges: [{ type: "entity", entity: "sensor.temperature" }],
            tap_action: { action: "navigate", navigation_path: "/office" },
          },
        })
        await tick()
        assert(
          grid.shadowRoot.querySelector(".card-header test-heading") === mainHeading &&
            mainHeading.config.icon === "mdi:desk" &&
            mainHeading.config.badges[0].entity === "sensor.temperature",
          "heading edits reuse the native element and preserve badges/actions"
        )
        grid.preview = true
        grid.layout = "sections"
        assert(
          mainHeading.hass === grid.hass &&
            mainHeading.preview === true &&
            mainHeading.layout === "sections",
          "native headings receive hass, preview, and layout"
        )
        grid.preview = false
        grid.layout = undefined
        const headingUpdates = mainHeading.setCount
        for (let i = 0; i < 20; i++) grid.hass = { ...hass, states: { changed: i } }
        await tick()
        assert(
          mainHeading.setCount === headingUpdates,
          "hass updates don't reconfigure native headings"
        )
        grid.setConfig({ ...config, columns: 3 })
        await tick()
        assert(
          !grid.shadowRoot.querySelector(".card-header") && tiles()[0] === b,
          "removing a title preserves child cards"
        )
        grid.remove()
        await tick()
        assert(stops === 1, "unsubscribes on removal")
        document.body.append(grid)
        await tick()
        assert(
          getComputedStyle(grid).display !== "none" &&
            tiles()[0] === b &&
            !grid.shadowRoot.querySelector('[role="status"]'),
          "cached cards stay visible while a refreshed result is pending"
        )
        emit(1, ["light.b", "light.a", "light.c"])
        await tick()
        assert(tiles()[0] === b && created === 3, "remount reuses existing cards")
        grid.setConfig({ ...config, show_empty: false, title: "Pool lights" })
        emit(1, [])
        await tick()
        assert(getComputedStyle(grid).display === "none", "empty result hides grid")
        assert(
          !grid.shadowRoot.querySelector(".card-header") && (await grid.getCardSize()) === 0,
          "hidden empty grid has no title or reserved height"
        )
        assert(
          grid.hidden && grid.connectedWhileHidden && grid.isConnected && stops === 1,
          "empty grids remain subscribed so they can recover"
        )
        grid.preview = true
        await tick()
        assert(getComputedStyle(grid).display !== "none", "empty grid remains editable in preview")
        assert(
          grid.shadowRoot.querySelector(".card-header").textContent === "Pool lights",
          "empty preview shows the configured title"
        )
        grid.preview = false
        emit(1, ["light.a"])
        await tick()
        assert(
          getComputedStyle(grid).display !== "none" && tiles().length === 1,
          "empty grid recovers"
        )
        assert(
          grid.shadowRoot.querySelector(".card-header").textContent === "Pool lights",
          "title recovers with matching entities"
        )
        subscriptions[1].callback({ error: { message: "bad query" } })
        await tick()
        assert(
          grid.shadowRoot.querySelector('[role="alert"]').textContent.includes("bad query"),
          "query errors are visible"
        )
        grid.shadowRoot.querySelector("button").click()
        await tick()
        emit(2, ["light.a"])
        await tick()
        assert(
          tiles().length === 1 && !grid.shadowRoot.querySelector('[role="alert"]'),
          "retry recovers"
        )
        grid.setConfig({
          ...config,
          include: [
            { domain: "light", state: "on", card: { type: "button" } },
            { domain: "light" },
          ],
        })
        await tick()
        emit(3, [
          { entity: "light.a", group: 0 },
          { entity: "light.b", group: 1 },
        ])
        await tick()
        const [button, tile] = tiles()
        assert(
          button.config.type === "button" && tile.config.type === "tile",
          "per-include card configuration"
        )
        assert(button.config.name.type === "entity", "group cards inherit global defaults")
        emit(3, [
          { entity: "light.a", group: 1 },
          { entity: "light.b", group: 1 },
        ])
        await tick()
        assert(
          tiles()[0] !== button && tiles()[0].config.type === "tile",
          "winning-group change replaces changed card"
        )
        assert(tiles()[1] === tile, "winning-group change preserves unaffected cards")
        assert(subscriptions.length === 4, "group changes don't reopen the backend query")
        const retainedA = tiles()[0]
        grid.setConfig({ ...config, group: "area" })
        await tick()
        const section = (value, title, entities) => ({
          value,
          title,
          heading: { type: "heading", heading_style: "subtitle", heading: title },
          matches: entities.map((entity) => ({ entity, group: 0 })),
        })
        const emitSections = (value) => subscriptions[4].callback({ result: value })
        emitSections([section("Pool", "Pool", ["light.a"]), section("Other", "Other", ["light.b"])])
        await tick()
        assert(
          grid.shadowRoot.querySelectorAll(".section").length === 2,
          "renders a fresh grid per group"
        )
        assert(
          [...grid.shadowRoot.querySelectorAll(".group-header")]
            .map((el) => el.textContent)
            .join() === "Pool,Other",
          "renders group headings"
        )
        assert(
          tiles()[0] === retainedA && tiles()[1] === tile,
          "enabling grouping reuses existing cards"
        )
        assert(
          (await grid.getCardSize()) === 4,
          "group headers and incomplete rows contribute to size"
        )
        grid.setConfig({ ...config, group: "area", columns: "all" })
        emitSections([
          section("Pool", "Pool", ["light.a", "light.c"]),
          section("Other", "Other", ["light.b"]),
        ])
        await tick()
        assert(
          columnCounts().join() === "2,1",
          "all columns are calculated independently per group"
        )
        assert(
          (await grid.getCardSize()) === 4,
          "grouped all sizing includes headings and one row per group"
        )
        emitSections([section("Other", "Other", ["light.a", "light.c", "light.b"])])
        await tick()
        assert(
          columnCounts()[0] === 3 && (await grid.getCardSize()) === 1,
          "all column counts follow group membership"
        )
        emitSections([section("Pool", "Pool", ["light.a"]), section("Other", "Other", ["light.b"])])
        await tick()
        assert(columnCounts().join() === "1,1", "shrinking groups update their auto column counts")
        grid.setConfig({ ...config, group: "area" })
        await tick()
        assert(
          tiles()[0] === retainedA && tiles()[1] === tile && subscriptions.length === 5,
          "grouped layout changes preserve retained cards and subscriptions"
        )
        const subtitle = grid.shadowRoot.querySelector(".group-header test-heading")
        assert(
          subtitle?.config.type === "heading" && subtitle.config.heading_style === "subtitle",
          "group labels use native Subtitle heading cards"
        )
        const createdBeforeMove = created
        emitSections([
          section("Pool", "<img src=x>", ["light.a"]),
          section("Other", "Other", ["light.b"]),
        ])
        await tick()
        assert(
          grid.shadowRoot.querySelector(".group-header").textContent === "<img src=x>" &&
            !grid.shadowRoot.querySelector("img"),
          "group headings are text, never HTML"
        )
        emitSections([
          section("Pool", "Renamed", ["light.a"]),
          section("Other", "Other", ["light.b"]),
        ])
        await tick()
        assert(
          grid.shadowRoot.querySelector(".group-header").textContent === "Renamed" &&
            tiles()[0] === retainedA,
          "title-only changes update without recreating cards"
        )
        emitSections([section("Other", "Other", ["light.a", "light.b"])])
        await tick()
        assert(grid.shadowRoot.querySelectorAll(".section").length === 1, "removes empty groups")
        assert(
          tiles()[0] === retainedA && tiles()[1] === tile && created === createdBeforeMove,
          "moving a card between groups preserves actual elements"
        )
        assert(
          !grid.shadowRoot.querySelector(".group-header"),
          "a single group's heading is suppressed"
        )
        assert((await grid.getCardSize()) === 1, "a single group reserves no header height")
        assert(!subtitle.isConnected, "suppressed native group heading is not left in the DOM")
        grid.setConfig({ ...config, group: "area", title: "Grouped controls" })
        await tick()
        assert(
          grid.shadowRoot.querySelector(".card-header").textContent === "Grouped controls" &&
            !grid.shadowRoot.querySelector(".group-header") &&
            (await grid.getCardSize()) === 2,
          "top-level title remains visible for a single group"
        )
        emitSections([section("Pool", "Pool", ["light.a"]), section("Other", "Other", ["light.b"])])
        await tick()
        assert(
          grid.shadowRoot.querySelectorAll(".group-header").length === 2 &&
            (await grid.getCardSize()) === 5,
          "headings and sizing return when a second group appears"
        )
        assert(
          tiles()[0] === retainedA && tiles()[1] === tile && created === createdBeforeMove,
          "one-to-many group transitions retain cards"
        )
        mutations = 0
        for (let i = 0; i < 100; i++) grid.hass = { ...hass, states: { generation: i } }
        await tick()
        assert(mutations === 0, "grouped state updates don't touch the DOM")
        emitSections([])
        await tick()
        assert(
          getComputedStyle(grid).display === "none" &&
            !grid.shadowRoot.querySelector(".group-header"),
          "empty grouped results hide all headings"
        )
        grid.remove()
        await tick()

        let manifestCalls = 0
        connection.sendMessagePromise = async (request) => {
          assert(request.type === "manifest/list", "uses native manifest metadata")
          manifestCalls++
          return [{ domain: "mqtt", name: "MQTT" }]
        }
        const integrationConfig = { include: { domain: "light" }, group: "integration" }
        const first = document.createElement("auto-grid"),
          second = document.createElement("auto-grid")
        for (const card of [first, second]) {
          card.setConfig(integrationConfig)
          card.hass = hass
          document.body.append(card)
        }
        await tick()
        assert(manifestCalls === 1, "integration manifests are cached per connection")
        assert(subscriptions.length === 6, "integration groups share one template subscription")
        assert(
          subscriptions[5].request.variables.ag_integration_names.mqtt === "MQTT",
          "integration display names reach backend title templates"
        )
        subscriptions[5].callback({
          result: [
            section("mqtt", "MQTT", ["light.a"]),
            section("zha", "Zigbee Home Automation", ["light.b"]),
          ],
        })
        await tick()
        assert(
          first.shadowRoot.querySelector(".group-header").textContent === "MQTT" &&
            second.shadowRoot.querySelector(".group-header").textContent === "MQTT",
          "integration groups use backend-rendered friendly headings"
        )
        first.remove()
        second.remove()
        await tick()
        const dynamic = document.createElement("auto-grid")
        const dynamicIndex = subscriptions.length
        dynamic.setConfig({
          include: { type: "update" },
          card: {
            type: "custom:mushroom-template-card",
            primary: "{{ entity_name(entity) }}",
            tap_action: { action: "url", $url_path: "{{ state_attr(entity, 'url') }}" },
          },
        })
        dynamic.hass = hass
        document.body.append(dynamic)
        await tick()
        assert(
          subscriptions.length === dynamicIndex + 1,
          "dynamic options use only the existing query subscription"
        )
        const dynamicResult = (values) =>
          subscriptions[dynamicIndex].callback({
            result: [{ entity: "update.container", group: 0, values }],
          })
        dynamicResult(["https://example.com/first"])
        await tick()
        const dynamicTile = dynamic.shadowRoot.querySelector("test-tile")
        const dynamicCreated = created
        assert(
          dynamicTile.config.primary === "{{ entity_name(entity) }}",
          "Mushroom templates pass through unchanged"
        )
        assert(
          dynamicTile.config.tap_action.url_path === "https://example.com/first" &&
            !("$url_path" in dynamicTile.config.tap_action),
          "$ keys become rendered destination properties"
        )
        dynamicResult(["https://example.com/second"])
        await tick()
        assert(
          dynamic.shadowRoot.querySelector("test-tile") === dynamicTile &&
            created === dynamicCreated &&
            dynamicTile.setCount === 2,
          "changed URL reconfigures rather than recreates the native card"
        )
        dynamicResult(["https://example.com/second"])
        await tick()
        assert(dynamicTile.setCount === 2, "identical rendered options do not call setConfig")
        let dynamicMutations = 0
        const dynamicObserver = new MutationObserver(() => dynamicMutations++)
        dynamicObserver.observe(dynamic.shadowRoot, {
          childList: true,
          attributes: true,
          subtree: true,
        })
        for (let i = 0; i < 40; i++) dynamic.hass = { ...hass, states: { generation: i } }
        await tick()
        assert(
          dynamicMutations === 0 && dynamicTile.setCount === 2,
          "ordinary hass updates don't process templates or mutate the DOM"
        )
        dynamicObserver.disconnect()
        dynamic.remove()
        await tick()
        const parent = document.createElement("auto-grid")
        const parentIndex = subscriptions.length
        const parentEntity = "pyscript.alert_example"
        parent.setConfig({
          include: { entity_id: parentEntity },
          card: {
            type: "custom:auto-grid",
            sort: [],
            include: [
              { $entity_id: "{{ entity }}", card: { type: "tile" } },
              {
                $entity_id: "{{ state_attr(entity, 'entities') | default([], true) | to_json }}",
                card: { type: "custom:mushroom-entity-card" },
              },
            ],
          },
        })
        parent.hass = hass
        document.body.append(parent)
        await tick()
        const parentResult = (json) =>
          subscriptions[parentIndex].callback({
            result: [{ entity: parentEntity, group: 0, values: [parentEntity, json] }],
          })
        parentResult('["sensor.b", "sensor.a"]')
        await tick()
        const nested = parent.shadowRoot.querySelector("auto-grid")
        assert(
          nested &&
            getComputedStyle(nested).display === "none" &&
            !nested.shadowRoot.querySelector('[role="status"]') &&
            (await nested.getCardSize()) === 0,
          "nested cards do not flash loading content before their first result"
        )
        assert(
          nested && subscriptions.length === parentIndex + 2,
          "a real nested Auto Grid subscribes using its rendered entity lists"
        )
        assert(
          subscriptions[parentIndex + 1].request.template.includes('["sensor.b","sensor.a"]') &&
            !subscriptions[parentIndex + 1].request.template.includes("states | map"),
          "JSON child IDs compile directly to candidates"
        )
        subscriptions[parentIndex + 1].callback({
          result: [
            { entity: parentEntity, group: 0 },
            { entity: "sensor.b", group: 1 },
            { entity: "sensor.a", group: 1 },
          ],
        })
        await tick()
        const nestedTiles = () => [...nested.shadowRoot.querySelectorAll("test-tile")]
        const headerTile = nestedTiles()[0]
        assert(
          nestedTiles()
            .map((tile) => tile.config.entity)
            .join() === `${parentEntity},sensor.b,sensor.a`,
          "nested grid keeps its header first and related entities in list order"
        )
        assert(
          nestedTiles()[1].config.type === "custom:mushroom-entity-card",
          "child entity rules keep their own card configuration"
        )
        parentResult("[]")
        await tick()
        assert(
          parent.shadowRoot.querySelector("auto-grid") === nested,
          "changing JSON selection reconfigures rather than recreates the nested grid"
        )
        assert(
          subscriptions.length === parentIndex + 3,
          "only the inner query changes when the JSON list changes"
        )
        subscriptions[parentIndex + 2].callback({ result: [{ entity: parentEntity, group: 0 }] })
        await tick()
        assert(
          nestedTiles().length === 1 && nestedTiles()[0] === headerTile,
          "an empty child list retains the existing alert header"
        )
        const stopsBeforeParentRemoval = stops
        parent.remove()
        await tick()
        assert(
          stops === stopsBeforeParentRemoval + 2,
          "nested subscriptions both close when the parent disconnects"
        )
        const pending = document.createElement("auto-grid")
        const pendingIndex = subscriptions.length
        pending.setConfig({ include: { entity_id: "light.pending" } })
        pending.hass = hass
        document.body.append(pending)
        await tick()
        subscriptions[pendingIndex].callback({ error: { message: "pending query failed" } })
        await tick()
        assert(
          getComputedStyle(pending).display !== "none" &&
            pending.shadowRoot
              .querySelector('[role="alert"]')
              .textContent.includes("pending query failed") &&
            (await pending.getCardSize()) === 1,
          "errors stay visible even before any matching cards arrive"
        )
        pending.shadowRoot.querySelector("button").click()

        slow.setConfig({ card: { type: "custom:slow-card", content: "Old" } })
        slow.hass = hass
        document.body.append(slow)
        await tick()
        const late = pendingCards.at(-1)
        slow.setConfig({ card: { type: "markdown", content: "New" } })
        await tick()
        late.resolve(late.card)
        await tick()
        assert(
          slow.shadowRoot.querySelector("test-tile").config.content === "New" &&
            !late.card.isConnected,
          "late child creation cannot overwrite newer Auto Card config"
        )
        slow.setConfig({ card: { type: "custom:slow-card", content: "Disconnected" } })
        await tick()
        const disconnectedChild = pendingCards.at(-1)
        slow.remove()
        disconnectedChild.resolve(disconnectedChild.card)
        await tick()
        assert(
          !disconnectedChild.card.isConnected,
          "pending Auto Card children never mount after disconnect"
        )

        const NativeResizeObserver = window.ResizeObserver
        const observedTargets = new Set()
        let resizeObservers = 0
        const observerInstances = []
        // Virtual-time headless runs do not reliably deliver animation-frame observers.
        window.ResizeObserver = class {
          targets = new Set()
          constructor(callback) {
            this.callback = callback
            resizeObservers++
            observerInstances.push(this)
          }
          observe(target) {
            this.targets.add(target)
            observedTargets.add(target)
          }
          unobserve(target) {
            this.targets.delete(target)
            observedTargets.delete(target)
          }
          disconnect() {
            for (const target of this.targets) observedTargets.delete(target)
            this.targets.clear()
          }
        }
        const settleResize = async () => {
          await tick()
          for (const observer of observerInstances)
            observer.callback([...observer.targets].map((target) => ({ target })))
          await tick()
        }
        const responsive = document.createElement("auto-grid")
        const responsiveIndex = subscriptions.length
        const responsiveConfig = {
          include: { entity: Array.from({ length: 6 }, (_, i) => `light.responsive_${i}`) },
          columns: "auto",
          sort: [],
        }
        responsive.style.width = "440px"
        responsive.setConfig(responsiveConfig)
        responsive.hass = hass
        let responsiveUpdates = 0,
          responsiveSizeEvents = 0
        responsive.addEventListener("card-updated", () => responsiveUpdates++)
        responsive.addEventListener("card-size-changed", () => responsiveSizeEvents++)
        document.body.append(responsive)
        emit(responsiveIndex, responsiveConfig.include.entity)
        await settleResize()
        const responsiveGrid = () => responsive.shadowRoot.querySelector(".grid")
        const responsiveColumns = () =>
          getComputedStyle(responsiveGrid()).gridTemplateColumns.split(" ").length
        const responsiveTiles = [...responsive.shadowRoot.querySelectorAll("test-tile")]
        const responsiveCreated = created
        assert(
          responsiveColumns() === 3 && (await responsive.getCardSize()) === 2,
          "auto wraps using a 140px minimum and reports actual rows"
        )
        assert(
          resizeObservers === 1 && observedTargets.size === 1,
          "one observer watches the responsive grid"
        )
        const beforeResize = responsiveUpdates
        responsive.style.width = "430px"
        await settleResize()
        assert(
          responsiveColumns() === 2 &&
            (await responsive.getCardSize()) === 3 &&
            responsiveUpdates === beforeResize + 1,
          `resizing across a breakpoint reports the new masonry size (columns=${responsiveColumns()}, size=${await responsive.getCardSize()}, updates=${responsiveUpdates}, before=${beforeResize})`
        )
        const stableUpdates = responsiveUpdates,
          stableSizeEvents = responsiveSizeEvents
        responsive.style.width = "420px"
        for (let i = 0; i < 20; i++) responsive.hass = { ...hass, states: { generation: i } }
        await settleResize()
        assert(
          responsiveUpdates === stableUpdates && responsiveSizeEvents === stableSizeEvents,
          "resizing within a column band and hass updates emit no sizing events"
        )
        responsive.style.width = "600px"
        responsive.setConfig({ ...responsiveConfig, columns: "180px" })
        await settleResize()
        assert(
          responsiveColumns() === 3 && (await responsive.getCardSize()) === 2,
          "explicit pixel minimums control responsive wrapping"
        )
        assert(
          responsive.shadowRoot.querySelector("test-tile") === responsiveTiles[0] &&
            created === responsiveCreated &&
            subscriptions.length === responsiveIndex + 1,
          "resizing and layout changes preserve cards and the backend query"
        )
        responsive.style.width = "100px"
        await settleResize()
        assert(
          responsiveColumns() === 1 &&
            responsiveGrid().getBoundingClientRect().width <= 100 &&
            responsive.shadowRoot.querySelector(".cell").getBoundingClientRect().width <= 100,
          "a minimum wider than the container does not overflow"
        )
        responsive.style.width = "1100px"
        emit(responsiveIndex, responsiveConfig.include.entity.slice(0, 2))
        await settleResize()
        assert(
          responsiveColumns() === 5 &&
            responsive.shadowRoot.querySelector(".cell").getBoundingClientRect().width < 300 &&
            (await responsive.getCardSize()) === 1,
          "auto-fill reserves empty tracks rather than stretching sparse results"
        )
        responsive.setConfig({ ...responsiveConfig, columns: "all" })
        await settleResize()
        assert(
          observedTargets.size === 0 && responsiveColumns() === 2,
          "single-row mode releases resize observations"
        )
        responsive.setConfig({ ...responsiveConfig, columns: "auto" })
        await settleResize()
        assert(
          resizeObservers === 1 && observedTargets.size === 1,
          "returning to responsive mode reuses the observer"
        )
        responsive.remove()
        await settleResize()
        assert(observedTargets.size === 0, "disconnect releases all resize observations")
        document.body.append(responsive)
        await settleResize()
        emit(subscriptions.length - 1, responsiveConfig.include.entity.slice(0, 2))
        await settleResize()
        assert(
          observedTargets.size === 1 && resizeObservers === 1,
          "reconnection restores responsive observation"
        )
        responsive.setConfig({ ...responsiveConfig, columns: "180px", group: "area" })
        await settleResize()
        const responsiveGroupIndex = subscriptions.length - 1
        const responsiveSections = [
          section("First", "First", responsiveConfig.include.entity.slice(0, 2)),
          section("Second", "Second", responsiveConfig.include.entity.slice(2, 3)),
        ]
        subscriptions[responsiveGroupIndex].callback({ result: responsiveSections })
        await settleResize()
        assert(
          observedTargets.size === 2 &&
            resizeObservers === 1 &&
            (await responsive.getCardSize()) === 4,
          "one observer measures all group grids and accounts for their headings"
        )
        responsive.style.width = "100px"
        await settleResize()
        assert(
          (await responsive.getCardSize()) === 5,
          "grouped responsive sizing counts wrapped rows in each group"
        )
        subscriptions[responsiveGroupIndex].callback({ result: [responsiveSections[0]] })
        await settleResize()
        assert(
          observedTargets.size === 1 && (await responsive.getCardSize()) === 2,
          "removed groups release observations and single-group headings remain hidden"
        )
        responsive.remove()
        window.ResizeObserver = NativeResizeObserver
        await tick()
        document.body.dataset.status = "passed"
        document.querySelector("#result").textContent = `Passed ${assertions} browser assertions`
      } catch (error) {
        document.body.dataset.status = "failed"
        document.querySelector("#result").textContent = error.stack
      }
    </script>
  </body>
</html>
